    <g transform="rotate(45)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#16161A" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(135)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#16161A" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(225)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#16161A" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(315)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#16161A" stroke="#16161A" stroke-width="18.0"/></g>
    <circle cx="0" cy="0" r="47.0" fill="#16161A" stroke="#16161A" stroke-width="18.0"/>
  </g>
  <g transform="translate(236.0,236.0)">
    <g transform="rotate(45)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#FF6644" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(135)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#FBC711" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(225)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#89D29F" stroke="#16161A" stroke-width="18.0"/></g>
    <g transform="rotate(315)"><rect x="-38" y="-194" width="76" height="166" rx="38" fill="#71A3FD" stroke="#16161A" stroke-width="18.0"/></g>
    <circle cx="0" cy="0" r="47.0" fill="#FFFCF3" stroke="#16161A" stroke-width="18.0"/>
  </g>
</svg>
