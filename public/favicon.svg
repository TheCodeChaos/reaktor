<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Reaktor">
  <!-- Ported from PinwheelLogo in the app (lib/widgets/pinwheel_logo.dart):
       four capsule arms swept at 45 degree offsets, each outlined in ink and
       sitting on one shared hard shadow. Constants match the Dart source, so
       the site mark and the in-app mark are the same drawing. -->
